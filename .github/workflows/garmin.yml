name: Extraer Datos Garmin

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear carpeta temporal
        run: mkdir -p ./datos_garmin

      - name: Iniciar sesión en Garmin y generar tokens
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python -c "import os; from garminconnect import Garmin; api = Garmin(os.environ['GARMIN_EMAIL'], os.environ['GARMIN_PASSWORD']); api.login(); api.garth.dump('.garth')"

      - name: Extraer métricas y actividades
        env:
          SAVE_PATH: ./datos_garmin
          CHECK_MOUNT_STATUS: 'False'
        run: |
          python history_garmin_import.py
          python history_garmin_activities.py

      - name: Instalar Rclone y Subir a Drive
        env:
          CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          sudo curl -s https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          python -c 'import os; f=open(os.path.expanduser("~/.config/rclone/rclone.conf"), "w"); f.write(os.environ.get("CONF", "")); f.close()'
          rclone copy ./datos_garmin gdrive:Datos_Garmin
